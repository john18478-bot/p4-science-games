<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小四科學遊戲站</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#081121;color:#f5f9ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:5px}
.home{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:clamp(20px,5vw,72px);background:radial-gradient(ellipse at 18% 10%,#193a44,transparent 55%),radial-gradient(ellipse at 90% 90%,#25254c,transparent 50%),#081121}
.content{width:min(100%,960px)}
.kicker{color:#9cf0e7;font-weight:800;letter-spacing:.18em;font-size:.82rem}
h1{font-size:clamp(2.4rem,6vw,4.6rem);line-height:1.12;letter-spacing:-.04em;margin:.28em 0 .18em}
.intro{margin:0 0 2rem;color:#c8d5e9}
.lessons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.lesson{--accent:#a6eb97;display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;padding:clamp(18px,3vw,30px);border:1px solid #548371;border-radius:22px;background:linear-gradient(145deg,#203e3c,#111f30);color:inherit;transition:transform .18s,border-color .18s}
.lesson.space{--accent:#a7d9ff;border-color:#657fbb;background:linear-gradient(145deg,#262f59,#121f36)}
.lesson:hover{transform:translateY(-3px);border-color:var(--accent)}
.lesson .icon{width:58px;height:58px;display:grid;place-items:center;font-size:31px;border:1px solid #ffffff36;border-radius:15px;background:#ffffff13}
.tag{color:var(--accent);font-size:.82rem;font-weight:800}
.lesson strong{font-size:clamp(1.25rem,2.6vw,1.7rem)}
.description{color:#d5e1ef;line-height:1.5}
.launch{color:var(--accent);font-weight:800;margin-top:auto;padding-top:8px}
.player{height:100vh;height:100dvh;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:5px max(10px,env(safe-area-inset-right)) 5px max(10px,env(safe-area-inset-left));background:#101d33;border-bottom:1px solid #374765;min-height:48px}
.bar button{background:#243a59;border:1px solid #6381a8;border-radius:8px;color:#fff;font-weight:700;padding:8px 12px;white-space:nowrap}
.bar span{font-size:clamp(.8rem,2.4vw,1rem);font-weight:700}
.frame-slot{flex:1;min-height:0;display:flex}
iframe{width:100%;height:100%;border:0;display:block;background:#081121}
@media(max-width:640px){.lessons{grid-template-columns:1fr;gap:12px}.intro{margin-bottom:1.1rem}.lesson{gap:8px}.lesson .icon{width:44px;height:44px;font-size:24px}}
@media(prefers-reduced-motion:reduce){.lesson{transition:none}.lesson:hover{transform:none}}
</style>
</head>
<body>
<main id="home" class="home">
 <div class="content">
  <div class="kicker">小學四年級 · 科學溫習</div>
  <h1>小四科學遊戲站</h1>
  <p class="intro">選擇一課，開始你的科學挑戰。</p>
  <div class="lessons">
   <button type="button" class="lesson" data-game="weather">
    <span class="icon" aria-hidden="true">⛅</span>
    <span class="tag">雙人小遊戲</span>
    <strong>第三課｜天氣與氣候</strong>
    <span class="description">寶可夢科學對戰 · 兩組輪流答題，答對就能出招。</span>
    <span class="launch">開始對戰 →</span>
   </button>
   <button type="button" class="lesson space" data-game="nature">
    <span class="icon" aria-hidden="true">🚀</span>
    <span class="tag">單人小遊戲</span>
    <strong>第四課｜動植物與環境</strong>
    <span class="description">星際科學戰機 · 一邊答題，一邊操控戰機迎戰。</span>
    <span class="launch">駕駛戰機 →</span>
   </button>
  </div>
 </div>
</main>
<section id="player" class="player" hidden aria-label="遊戲畫面">
 <header class="bar"><button id="back" type="button">← 返回選課</button><span id="lesson-title"></span></header>
 <div id="frame-slot" class="frame-slot"></div>
</section>

n-width:30px}.hud{width:34%;min-width:205px}.hudTitle{font-size:12px}.hudFoot{font-size:11px}.energy:before{font-size:9px}.pip{width:7px;height:9px}.level{font-size:12px}.turnFlag{max-width:30%;font-size:11px}.choice{padding:7px;font-size:14px;gap:6px}.choice .key{flex-basis:22px;height:24px;font-size:12px}.choice .skillName{font-size:17px}.choice .skillMeta{font-size:11px}.promptTitle{font-size:17px}.modal{padding:17px 20px}.modalActions{gap:10px}.primary,.secondary{font-size:14px;padding:8px 13px}}\n@media(max-width:600px) and (orientation:portrait){#app{min-height:0}.arena{min-height:200px}.battlePanel{flex-basis:48%;min-height:300px;padding:7px}.promptBox{width:100%;flex-basis:42%;padding:10px}.promptTitle{font-size:16px}.choiceBox{padding:4px}.choice{font-size:13px}.hud{width:43%;min-width:0;padding:5px 6px;border-width:3px}.hud.enemy{top:12px;left:8px}.hud.hero{bottom:10px;right:8px}.hudTitle{font-size:11px}.level{font-size:10px}.hudFoot{font-size:10px;flex-wrap:wrap;gap:4px}.hpRow{margin-top:3px}.hpTrack{height:8px}.energy:before{display:none}.turnFlag{font-size:9px;top:12px;max-width:36%;left:78%;padding:4px 5px}.overlay{padding:12px}.modal h1{font-size:25px}.pName{padding:9px 11px}.menuCharacters{gap:10px}.toast{bottom:49%}.modal.wide{font-size:13px}.scoreTable th,.scoreTable td{padding:7px 5px}.primary,.secondary{min-height:47px}.tools .tool{font-size:0;min-width:27px;width:27px;padding:0}.tools .tool:before{font-size:13px}.tools #soundBtn:before{content:'♪'}.tools #musicBtn:before{content:'♫'}.tools #motionBtn:before{content:'✦'}.tools #pauseBtn:before{content:'Ⅱ'}.tools #skipBtn:before{content:'≫'}.tools #fullBtn:before{content:'⛶'}.tools #restartBtn:before{content:'↻'}}\n@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}\n\n.ruleGrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;text-align:left}.ruleGrid h3{font-size:17px;color:#3d6352;margin:7px 0}.ruleGrid p{font-size:14px;line-height:1.75}.ruleGrid .scoreTable{font-size:14px}.ruleGrid .scoreTable td,.ruleGrid .scoreTable th{padding:5px 8px}@media(max-width:600px){.ruleGrid{grid-template-columns:1fr;gap:8px}}\n\n.energy:after{content:attr(data-value);font-size:11px;margin-left:3px;font-variant-numeric:tabular-nums}\n@media(pointer:coarse) and (min-width:900px){.tool{height:44px;min-width:44px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"app\">\n\u003cheader>\u003cdiv class=\"logo\">\u003ci>⚡\u003c/i> 寶可夢科學對戰\u003c/div>\u003cspan class=\"headerStatus\" id=\"headerStatus\">天氣、氣候與全球增温 · 小四科學\u003c/span>\u003cdiv class=\"tools\">\u003cbutton class=\"tool\" id=\"soundBtn\" title=\"音效\" aria-label=\"音效開關\">♪ 音效\u003c/button>\u003cbutton class=\"tool\" id=\"musicBtn\" title=\"背景音樂\" aria-label=\"背景音樂開關\">♫ 音樂\u003c/button>\u003cbutton class=\"tool\" id=\"motionBtn\" title=\"減少動畫\">動態\u003c/button>\u003cbutton class=\"tool\" id=\"pauseBtn\" title=\"暫停\">⏸ 暫停\u003c/button>\u003cbutton class=\"tool\" id=\"skipBtn\" title=\"跳過攻擊動畫\">⏭ 跳過\u003c/button>\u003cbutton class=\"tool\" id=\"fullBtn\" title=\"全螢幕\">⛶ 全螢幕\u003c/button>\u003cbutton class=\"tool\" id=\"restartBtn\" title=\"重新開始\">↻ 重開\u003c/button>\u003c/div>\u003c/header>\n\u003cdiv class=\"arena\" id=\"arena\">\u003ccanvas id=\"scene\" width=\"480\" height=\"250\" role=\"img\" aria-label=\"復古像素戰鬥場景，A 組在近方草地，B 組在遠方平台\">\u003c/canvas>\u003cdiv class=\"battleTint\">\u003c/div>\n\u003cdiv class=\"hud enemy\">\u003cdiv class=\"hudTop\">\u003cdiv class=\"hudTitle\" id=\"enemyName\">B組｜超夢\u003c/div>\u003cdiv class=\"level\">Lv. 50\u003c/div>\u003c/div>\u003cdiv class=\"hpRow\">\u003cspan class=\"tiny\">HP\u003c/span>\u003cdiv class=\"hpTrack\">\u003cdiv class=\"hpFill\" id=\"enemyFill\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"hudFoot\">\u003cspan id=\"enemyHp\">120 / 120\u003c/span>\u003cspan class=\"energy\" id=\"enemyEnergy\" aria-label=\"超夢技能能量 0 / 6\">\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"hud hero\">\u003cdiv class=\"hudTop\">\u003cdiv class=\"hudTitle\" id=\"heroName\">A組｜比卡超\u003c/div>\u003cdiv class=\"level\">Lv. 50\u003c/div>\u003c/div>\u003cdiv class=\"hpRow\">\u003cspan class=\"tiny\">HP\u003c/span>\u003cdiv class=\"hpTrack\">\u003cdiv class=\"hpFill\" id=\"heroFill\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"hudFoot\">\u003cspan id=\"heroHp\">120 / 120\u003c/span>\u003cspan class=\"energy\" id=\"heroEnergy\" aria-label=\"比卡超技能能量 0 / 6\">\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"turnFlag\" id=\"turnFlag\" role=\"status\">小四科學對戰\u003c/div>\u003cdiv class=\"battleMsg\" id=\"battleMsg\" aria-live=\"polite\">\u003c/div>\u003c/div>\n\u003cdiv class=\"battlePanel\">\u003csection class=\"promptBox\" id=\"promptBox\" aria-live=\"polite\">\u003cdiv class=\"promptHead\">\u003cspan>科學對戰\u003c/span> 選擇開始遊戲\u003c/div>\u003cdiv class=\"promptTitle\">透過科學知識，為寶可夢儲蓄能量！\u003c/div>\u003cdiv class=\"promptSub\">每組 5 題 · 每題最多作答兩次\u003c/div>\u003c/section>\u003csection class=\"choiceBox\" id=\"choiceBox\">\u003c/section>\u003c/div>\n\u003cdiv class=\"overlay\" id=\"overlay\" role=\"dialog\" aria-modal=\"true\" aria-label=\"遊戲選單\">\u003c/div>\u003cdiv class=\"pauseMask\" id=\"pauseMask\" role=\"button\" tabindex=\"0\" aria-label=\"繼續戰鬥\">⏸ 戰鬥暫停\u003cspan>按此或按上方「繼續」返回戰鬥\u003c/span>\u003c/div>\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\u003c/div>\n\u003cscript>\n'use strict';\n/* ==================== 教師可編輯題庫（10題、解說、分類） ==================== */\nconst QUESTION_BANK = [\n  {\n    \"id\": 1,\n    \"topic\": \"天氣與氣候\",\n    \"question\": \"天氣和氣候有甚麼分別？\",\n    \"options\": [\n      \"天氣和氣候都只描述當天的情況。\",\n      \"天氣描述短時間的天氣情況，氣候描述一個地方長期的天氣特徵。\",\n      \"天氣描述一個地方長期的情況，氣候只描述當天的情況。\",\n      \"天氣只描述氣温，氣候只描述雨量。\"\n    ],\n    \"correct\": 1,\n    \"explain\": \"今天下雨是天氣。一個地方長期的天氣特徵，例如香港夏季通常炎熱多雨，是氣候。\"\n  },\n  {\n    \"id\": 2,\n    \"topic\": \"全球增温\",\n    \"question\": \"以下哪一種冰融化後，會使海平面明顯上升？\",\n    \"options\": [\n      \"海冰\",\n      \"陸冰\",\n      \"海冰和陸冰都會\",\n      \"海冰和陸冰都不會\"\n    ],\n    \"correct\": 1,\n    \"explain\": \"陸冰融化後，融水流入海洋，使海平面上升。已浮在海上的海冰融化，對海平面的直接影響很小。\"\n  },\n  {\n    \"id\": 3,\n    \"topic\": \"天氣與氣候\",\n    \"question\": \"以下哪個地方通常全年多雨？\",\n    \"options\": [\n      \"香港\",\n      \"北京\",\n      \"坎培拉\",\n      \"新加坡\"\n    ],\n    \"correct\": 3,\n    \"explain\": \"新加坡位於赤道附近，通常全年温暖多雨。\"\n  },\n  {\n    \"id\": 4,\n    \"topic\": \"全球增温\",\n    \"question\": \"大量使用煤和石油，會排放大量哪一種氣體，加劇全球增温？\",\n    \"options\": [\n      \"氧氣\",\n      \"氮氣\",\n      \"二氧化碳\",\n      \"空氣\"\n    ],\n    \"correct\": 2,\n    \"explain\": \"燃燒煤和石油會釋放二氧化碳。二氧化碳是一種温室氣體。\"\n  },\n  {\n    \"id\": 5,\n    \"topic\": \"全球增温\",\n    \"question\": \"那些活動或行為會不必要地增加碳足跡？舉出一項。\",\n    \"options\": [\n      \"帶可重用的水樽上學\",\n      \"離開課室後，仍讓冷氣開着\",\n      \"在安全又方便的情況下，步行到附近的商店\",\n      \"用單面已印過的紙做草稿\"\n    ],\n    \"correct\": 1,\n    \"explain\": \"無人使用課室時仍開着冷氣，會浪費電力，增加不必要的碳排放。\"\n  },\n  {\n    \"id\": 6,\n    \"topic\": \"天氣與氣候\",\n    \"question\": \"學校在7月放暑假時天氣炎熱。如果小明想去一個寒冷的地方,他應該去南半球還是北半球的地方？\",\n    \"options\": [\n      \"北半球，因為北半球在 7 月是冬季。\",\n      \"南半球，因為南半球在 7 月是夏季。\",\n      \"兩個半球都可以，因為兩個半球的季節相同。\",\n      \"南半球，因為南半球在 7 月是冬季。\"\n    ],\n    \"correct\": 3,\n    \"explain\": \"南、北半球的季節相反。7 月是南半球的冬季，小明可選擇南半球較遠離赤道的地方。\"\n  },\n  {\n    \"id\": 7,\n    \"topic\": \"全球增温\",\n    \"question\": \"怎樣減緩全球增溫？\",\n    \"options\": [\n      \"多用燃煤發電。\",\n      \"多開私家車，少乘搭大型公共交通工具。\",\n      \"減少使用即棄餐具。\",\n      \"多砍伐樹木。\"\n    ],\n    \"correct\": 2,\n    \"explain\": \"減少使用即棄餐具，可減少製造和運送餐具所需的能源，從而減少碳排放。\"\n  },\n  {\n    \"id\": 8,\n    \"topic\": \"天氣與氣候\",\n    \"question\": \"香港天文台用甚麼來描述空氣的乾燥或潮濕程度？\",\n    \"options\": [\n      \"相對濕度\",\n      \"氣温\",\n      \"風速\",\n      \"雨量\"\n    ],\n    \"correct\": 0,\n    \"explain\": \"相對濕度通常以百分比表示。數值愈高，空氣愈接近飽和。\"\n  },\n  {\n    \"id\": 9,\n    \"topic\": \"全球增温\",\n    \"question\": \"全球增溫的成因是甚麼？舉出一項。\",\n    \"options\": [\n      \"地球每天自轉。\",\n      \"月球繞地球運行。\",\n      \"海冰融化。\",\n      \"工業發展。\"\n    ],\n    \"correct\": 3,\n    \"explain\": \"工業活動燃燒煤和石油等化石燃料，會增加温室氣體排放，加劇全球增温。\"\n  },\n  {\n    \"id\": 10,\n    \"topic\": \"全球增温\",\n    \"question\": \"全球增溫會帶來什麼影響？\",\n    \"options\": [\n      \"全球的海平面逐漸下降。\",\n      \"土地荒漠化。\",\n      \"全球所有地區的雨量都會減少。\",\n      \"地球上的四季會消失。\"\n    ],\n    \"correct\": 1,\n    \"explain\": \"全球增温可加劇部分地區的乾旱，使土地退化，增加荒漠化的風險。\"\n  }\n];\nconst MOVESETS={\n A:[{id:'quick',name:'電光一閃',en:'Quick Attack',damage:14,cost:0,duration:2150,hit:.53},{id:'shock',name:'電擊',en:'Thunder Shock',damage:18,cost:1,duration:2800,hit:.60},{id:'bolt',name:'十萬伏特',en:'Thunderbolt',damage:23,cost:2,duration:3400,hit:.62},{id:'volt',name:'伏特攻擊',en:'Volt Tackle',damage:30,cost:4,duration:3950,hit:.72}],\n B:[{id:'confusion',name:'念力',en:'Confusion',damage:14,cost:0,duration:2500,hit:.60},{id:'psychic',name:'精神強念',en:'Psychic',damage:18,cost:1,duration:3180,hit:.62},{id:'aura',name:'波導彈',en:'Aura Sphere',damage:23,cost:2,duration:3360,hit:.69},{id:'psystrike',name:'精神擊破',en:'Psystrike',damage:30,cost:4,duration:4050,hit:.75}],\n C:[{\"id\":\"scratch\",\"name\":\"抓\",\"en\":\"Scratch\",\"damage\":14,\"cost\":0,\"duration\":2350,\"hit\":0.53},{\"id\":\"ember\",\"name\":\"火花\",\"en\":\"Ember\",\"damage\":18,\"cost\":1,\"duration\":2700,\"hit\":0.6},{\"id\":\"flamethrower\",\"name\":\"噴射火焰\",\"en\":\"Flamethrower\",\"damage\":23,\"cost\":2,\"duration\":3100,\"hit\":0.64},{\"id\":\"fireblast\",\"name\":\"大字爆炎\",\"en\":\"Fire Blast\",\"damage\":30,\"cost\":4,\"duration\":3650,\"hit\":0.72}],\n D:[{\"id\":\"tackle\",\"name\":\"撞擊\",\"en\":\"Tackle\",\"damage\":14,\"cost\":0,\"duration\":2350,\"hit\":0.53},{\"id\":\"vinewhip\",\"name\":\"藤鞭\",\"en\":\"Vine Whip\",\"damage\":18,\"cost\":1,\"duration\":2700,\"hit\":0.6},{\"id\":\"razorleaf\",\"name\":\"飛葉快刀\",\"en\":\"Razor Leaf\",\"damage\":23,\"cost\":2,\"duration\":3100,\"hit\":0.64},{\"id\":\"solarbeam\",\"name\":\"日光束\",\"en\":\"Solar Beam\",\"damage\":30,\"cost\":4,\"duration\":3650,\"hit\":0.72}]\n};\nconst S={MAIN_MENU:'MAIN_MENU',TEAM_SETUP:'TEAM_SETUP',BATTLE_INTRO:'BATTLE_INTRO',QUESTION:'QUESTION',RETRY:'RETRY',ANSWER_FEEDBACK:'ANSWER_FEEDBACK',SKILL_SELECT:'SKILL_SELECT',ATTACK:'ATTACK',DAMAGE:'DAMAGE',TURN_END:'TURN_END',GAME_OVER:'GAME_OVER',REVIEW:'REVIEW'};\nconst $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d',{alpha:false});\nctx.setTransform(.5,0,0,.5,0,0);ctx.imageSmoothingEnabled=false;\nconst clamp=(v,min=0,max=1)=>Math.min(max,Math.max(min,v));\nconst mix=(a,b,t)=>a+(b-a)*t;\nconst ease=t=>{t=clamp(t);return t*t*(3-2*t)};\nconst shuffle=arr=>{let copy=[...arr];for(let i=copy.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy};\nconst esc=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst L='ABCD';\nconst ROSTER={A:'比卡超',B:'超夢',C:'小火龍',D:'奇異種子'};\nconst selectedMon={A:'A',B:'B'};\nfunction makeTeam(id,name){const species=selectedMon[id];return{id,name,species,mon:ROSTER[species],hp:120,displayHp:120,energy:0,stats:{first:0,second:0,failed:0,attacks:0,totalDamage:0,skills:[]},fainted:false}}\nconst game={state:S.MAIN_MENU,outro:null,faintTime:0,teams:{A:makeTeam('A','A 組'),B:makeTeam('B','B 組')},queue:[],index:0,active:'A',attempt:0,wrongChoice:null,pendingAnswer:null,feedback:null,reviewOnly:false,koWinner:null,animation:null,pendingMove:null,paused:false,clock:0,particles:[],scenePulse:0,damageFloat:null,settings:{sound:true,music:false,reduced:false},selectedStarter:'random',initialNames:{A:'A 組',B:'B 組'}};\nlet lastTime=performance.now(),lastUiRefresh=0,canvasShake=0,toastHide=0;\nfunction currentEntry(){return game.queue[game.index]}\nfunction activeTeam(){return game.teams[game.active]}\nfunction otherId(id){return id==='A'?'B':'A'}\nfunction makeQueue(starter){\n let digest=shuffle(QUESTION_BANK.filter(q=>q.topic==='全球增温'));\n let breath=shuffle(QUESTION_BANK.filter(q=>q.topic==='天氣與氣候'));\n let qa=shuffle([...digest.slice(0,3),...breath.slice(0,2)]),qb=shuffle([...digest.slice(3),...breath.slice(2)]);\n let entries=[];for(let i=0;i\u003c5;i++)for(const team of [starter,otherId(starter)]){\n  const q=(team==='A'?qa:qb)[i],options=shuffle(q.options.map((text,origin)=>({text,origin})));\n  entries.push({team,q,options,correct:options.findIndex(o=>o.origin===q.correct),attempts:[],result:null});\n }return entries;\n}\nfunction setState(next){game.state=next;renderUI();updateHud()}\nfunction startGame(){\n unlockAudio();game.teams.A=makeTeam('A',game.initialNames.A.trim().slice(0,18)||'A 組');game.teams.B=makeTeam('B',game.initialNames.B.trim().slice(0,18)||'B 組');\n game.index=0;game.previewSetup=false;game.pendingMove=null;game.outro=null;game.faintTime=0;game.attempt=0;game.pendingAnswer=null;game.feedback=null;game.wrongChoice=null;game.reviewOnly=false;game.koWinner=null;game.animation=null;game.paused=false;game.particles=[];game.damageFloat=null;game.scenePulse=0;canvasShake=0;toastHide=0;$('toast').classList.remove('show');\n let starter=game.selectedStarter==='random'?(Math.random()\u003c.5?'A':'B'):game.selectedStarter;\n game.queue=makeQueue(starter);game.active=starter;$('pauseMask').classList.remove('show');$('pauseBtn').textContent='⏸ 暫停';showOverlay('');setState(S.BATTLE_INTRO);playSound('start');\n game.introEnd=game.clock+950;\n}\nfunction showOverlay(html){const o=$('overlay');if(!html){o.classList.add('hidden');o.innerHTML='';$('promptBox').inert=false;$('choiceBox').inert=false;return}o.innerHTML=html;o.classList.remove('hidden');$('promptBox').inert=true;$('choiceBox').inert=true}\nfunction resetPreview(){game.queue=[];game.index=0;game.active='A';for(const id of ['A','B'])game.teams[id]=makeTeam(id,game.initialNames[id]);}\nfunction overlayMenu(){resetPreview();game.previewSetup=true;game.faintTime=0;for(const t of Object.values(game.teams))t.fainted=false;setState(S.MAIN_MENU);showOverlay(`\u003cdiv class=\"modal\">\u003ch1>⚡ 寶可夢科學對戰\u003c/h1>\u003cp>經典掌機風格 · 兩組科學問答 RPG\u003c/p>\u003cdiv class=\"menuCharacters\">\u003cdiv class=\"pName a\">A 組\u003cbr>${game.teams.A.mon}\u003c/div>\u003cdiv class=\"versus\">VS\u003c/div>\u003cdiv class=\"pName b\">B 組\u003cbr>${game.teams.B.mon}\u003c/div>\u003c/div>\u003cp>比卡超、超夢、小火龍、奇異種子任選兩隻\u003cbr>10 道小四科學題目 · 雙方各有 5 次作答機會\u003cbr>首次答對獲得 2 能量；再次答對獲得 1 能量。\u003c/p>\u003cdiv class=\"modalActions\">\u003cbutton class=\"primary\" data-action=\"setup\">開始科學對戰 ▶\u003c/button>\u003cbutton class=\"secondary\" data-action=\"rules\">對戰玩法\u003c/button>\u003cbutton class=\"secondary\" data-action=\"credits\">素材來源\u003c/button>\u003c/div>\u003cp class=\"setupNote\">角色與招式圖片已嵌入本檔案，無須連線。音效為原創生成。\u003c/p>\u003c/div>`)}\nfunction rosterSelect(side){\n const options=Object.entries(ROSTER).map(([key,name])=>`\u003coption value=\"${key}\" ${selectedMon[side]===key?'selected':''}>${name}\u003c/option>`).join('');\n return `\u003clabel class=\"fieldLabel\">${side} 組小精靈\u003cselect id=\"mon${side}\">${options}\u003c/select>\u003c/label>`;\n}\nfunction overlaySetup(){resetPreview();game.pendingMove=null;game.animation=null;game.outro=null;game.paused=false;game.damageFloat=null;game.particles=[];game.faintTime=0;game.koWinner=null;for(const t of Object.values(game.teams))t.fainted=false;game.previewSetup=true;setState(S.TEAM_SETUP);showOverlay(`\u003cdiv class=\"modal\">\u003ch2>⚔️ 對戰設定\u003c/h2>\u003cdiv class=\"inputGrid\">\u003clabel class=\"fieldLabel\">A 組名稱\u003cinput id=\"teamAInput\" maxlength=\"18\" value=\"${esc(game.initialNames.A)}\">\u003c/label>\u003clabel class=\"fieldLabel\">B 組名稱\u003cinput id=\"teamBInput\" maxlength=\"18\" value=\"${esc(game.initialNames.B)}\">\u003c/label>${rosterSelect('A')}${rosterSelect('B')}\u003clabel class=\"fieldLabel\" style=\"grid-column:1/-1\">先手設定\u003cselect id=\"starterSelect\">\u003coption value=\"random\">隨機決定先手\u003c/option>\u003coption value=\"A\">A 組先手\u003c/option>\u003coption value=\"B\">B 組先手\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cp class=\"setupNote\">請為兩組選擇不同的小精靈。雙方 HP：120｜技能能量：0｜各 5 題，最多兩次嘗試。選答案後需確認，避免誤觸。\u003c/p>\u003cdiv class=\"modalActions\">\u003cbutton class=\"secondary\" data-action=\"menu\">返回\u003c/button>\u003cbutton class=\"primary\" data-action=\"begin\">進入戰場 ▶\u003c/button>\u003c/div>\u003c/div>`);$('starterSelect').value=game.selectedStarter}\nfunction showRules(){showOverlay(`\u003cdiv class=\"modal wide\">\u003ch2>科學知識，就是對戰能量！\u003c/h2>\u003cdiv class=\"ruleGrid\">\u003cdiv>\u003ch3>① 兩組輪流答題\u003c/h3>\u003cp>共 5 個大回合、10 道題。每組各答 5 題：3 題全球增温、2 題天氣與氣候。題目及選項隨機排列，同局不重複。\u003c/p>\u003ch3>② 答對後選擇絕招\u003c/h3>\u003cp>首次答對：+2 能量，100% 傷害。\u003cbr>第二次答對：+1 能量，75% 傷害，四捨五入。\u003cbr>兩次答錯：顯示解說，交給下一組。\u003cbr>技能能量最多 6 點；不用急，答題沒有時限。\u003c/p>\u003c/div>\u003cdiv>\u003ch3>③ 雙方技能數值完全相同\u003c/h3>\u003ctable class=\"scoreTable\">\u003ctr>\u003cth>技能級別\u003c/th>\u003cth>傷害\u003c/th>\u003cth>能量\u003c/th>\u003c/tr>\u003ctr>\u003ctd>第一招\u003c/td>\u003ctd>14\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第二招\u003c/td>\u003ctd>18\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第三招\u003c/td>\u003ctd>23\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第四招\u003c/td>\u003ctd>30\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003c/table>\u003cp>本課堂遊戲不計屬性相剋、暴擊、閃避、反作用傷害或附加狀態；所有技能必定命中。\u003c/p>\u003c/div>\u003c/div>\u003cp>\u003cstrong>完成 10 題後，比較剩餘 HP；相同則比較首次答對題數，再相同為平手。\u003c/strong>\u003cbr>如 HP 提早歸零，會保留「完成剩餘科學題目」模式。答錯一次的題目也會收錄在「錯題重溫」。\u003c/p>\u003cp class=\"setupNote\">操作：選擇答案／技能後再確認。動畫結束後，按「下一回合」。可使用 1–4 或 A–D 選項；空白鍵暫停。音樂為原創復古旋律，需先按一下畫面才能播放。\u003c/p>\u003cdiv class=\"modalActions\">${actionBtn('返回主畫面','menu','secondary')}${actionBtn('開始對戰 ▶','setup')}\u003c/div>\u003c/div>`)}\nfunction showCredits(){showOverlay(`\u003cdiv class=\"modal wide\">\u003ch2>像素角色與招式素材\u003c/h2>\u003cp>角色使用網上像素動畫素材，已轉為影格圖集並嵌入 HTML。招式使用網上特效圖片，配合本遊戲的獨立移動、蓄力及命中演出。\u003c/p>\u003cdiv class=\"reviewList\">\u003cdiv class=\"reviewItem\">\u003cstrong>角色：PokéAPI / sprites\u003c/strong>\u003cp>Black / White 動畫：比卡超、超夢、小火龍及奇異種子的正面及背面像素影格。\u003c/p>\u003ca href=\"https://github.com/PokeAPI/sprites\" target=\"_blank\" rel=\"noopener noreferrer\">來源資料庫\u003c/a>\u003c/div>\u003cdiv class=\"reviewItem\">\u003cstrong>招式：Pokémon Showdown 特效素材\u003c/strong>\u003cp>電光一閃：impact；電擊：lightning / electroball；十萬伏特：lightning / impact；伏特攻擊：electroball / lightning；念力：purplewisp / stare；精神強念：purplewisp / stare；波導彈：iceball / wisp；精神擊破：purplewisp / psychic terrain。\u003c/p>\u003ca href=\"https://github.com/smogon/pokemon-showdown-client/tree/master/play.pokemonshowdown.com/fx\" target=\"_blank\" rel=\"noopener noreferrer\">特效素材資料庫\u003c/a>\u003c/div>\u003cdiv class=\"reviewItem\">\u003cp>角色及招式素材於 2026 年 11 月取得。這是非官方課堂溫習作品；Pokémon 角色及相關圖像權利屬各原權利人。招式演出由本遊戲重新組合，並非原遊戲的完整招式錄影。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"modalActions\">${actionBtn('返回主畫面','menu','secondary')}\u003c/div>\u003c/div>`)}\n\nfunction updateSettingsButtons(){syncAudio();for(const [id,v] of [['soundBtn',game.settings.sound],['musicBtn',game.settings.music],['motionBtn',!game.settings.reduced]]){$(id).setAttribute('aria-pressed',String(v))};$('motionBtn').textContent=game.settings.reduced?'動效：少':'動效：全';$('pauseBtn').disabled=[S.MAIN_MENU,S.TEAM_SETUP,S.GAME_OVER,S.REVIEW].includes(game.state);$('skipBtn').disabled=game.paused||![S.ATTACK,S.DAMAGE,S.BATTLE_INTRO].includes(game.state)}\nfunction updateHud(){\n for(const [key,tag] of [['A','hero'],['B','enemy']]){\n  let t=game.teams[key],hp=Math.max(0,Math.round(t.displayHp));$(tag+'Name').textContent=`${t.name}｜${t.mon}`;$(tag+'Hp').textContent=`${hp} / 120`;\n  $(tag+'Energy').setAttribute('aria-label',`技能能量 ${t.energy} / 6`);const bar=$(tag+'Fill');bar.style.width=`${100*clamp(hp/120)}%`;bar.style.background=hp>60?'linear-gradient(#a4ff85,#36b75d)':hp>24?'linear-gradient(#ffed72,#dfae2d)':'linear-gradient(#fc8b80,#ce3d4d)';\n  $(tag+'Energy').setAttribute('data-value',`${t.energy}/6`);$(tag+'Energy').innerHTML=Array.from({length:6},(_,i)=>`\u003cspan class=\"pip ${i\u003ct.energy?'on':''}\">\u003c/span>`).join('');\n }\n let turn=game.queue.length?Math.min(game.index+1,10):0;\n $('headerStatus').textContent=[S.MAIN_MENU,S.TEAM_SETUP].includes(game.state)?'天氣、氣候與全球增温 · 小四科學':`第 ${turn}/10 題　｜　${game.teams.A.name} 對戰 ${game.teams.B.name}`;\n const flag=$('turnFlag');flag.textContent=game.state===S.MAIN_MENU||game.state===S.TEAM_SETUP?'小四科學 × 寶可夢':game.state===S.GAME_OVER?'戰鬥結束':`輪到 ${game.teams[game.active].name} · 第 ${Math.floor(game.index/2)+1}/5 回合`;\n flag.className='turnFlag '+(game.active==='A'?'a':'b');updateSettingsButtons();\n}\nfunction prompt(head,title,sub=''){$('promptBox').innerHTML=`\u003cdiv class=\"promptHead\">\u003cspan>${esc(head)}\u003c/span>${esc(game.teams[game.active].mon)} · ${esc(game.teams[game.active].name)}\u003c/div>\u003cdiv class=\"promptTitle\">${esc(title)}\u003c/div>\u003cdiv class=\"promptSub\">${esc(sub)}\u003c/div>`}\nfunction setChoices(html){$('choiceBox').innerHTML=html}\nfunction actionBtn(text,action,klass='primary'){return `\u003cbutton class=\"${klass}\" data-action=\"${action}\">${esc(text)}\u003c/button>`}\nfunction renderUI(){\n $('app').setAttribute('data-state',game.state);updateHud();const e=currentEntry(),t=activeTeam(),state=game.state;\n if(state===S.MAIN_MENU||state===S.TEAM_SETUP){prompt('遊戲規則','用科學知識發動寶可夢絕招！','兩組輪流作答，雙方公平對戰。');setChoices(`\u003cdiv class=\"panelActions\">${actionBtn('開始遊戲','setup')}\u003c/div>`);return}\n if(state===S.BATTLE_INTRO){prompt('對戰開始',`${game.teams.A.name} 的${game.teams.A.mon} VS ${game.teams.B.name} 的${game.teams.B.mon}！`,'即將進入第一道科學題。');setChoices('\u003cdiv class=\"panelActions\">\u003cspan class=\"bigMessage\">準備開始！\u003c/span>\u003c/div>');return}\n if(state===S.QUESTION||state===S.RETRY){\n const h=`科學問題 ${game.index+1}/10 · ${e.q.topic}`,sub=state===S.RETRY?'第一次答錯了！剩下最後一次機會；再次答對可得 1 能量，傷害為 75%。':'首次答對可得 2 能量，使用技能時造成 100% 傷害。';\n prompt(h,e.q.question,sub);\n if(game.pendingAnswer!==null){let p=e.options[game.pendingAnswer];setChoices(`\u003cdiv class=\"panelActions\">\u003cdiv class=\"bigMessage\" style=\"font-size:18px\">確認答案：${L[game.pendingAnswer]}. ${esc(p.text)}\u003c/div>${actionBtn('返回修改','cancelAnswer','secondary')}${actionBtn('確定提交','confirmAnswer')}\u003c/div>`);return}\n setChoices(e.options.map((o,i)=>`\u003cbutton class=\"choice ${i===game.wrongChoice?'wrong':''}\" data-answer=\"${i}\" ${i===game.wrongChoice?'disabled':''}>\u003cspan class=\"key\">${L[i]}\u003c/span>\u003cspan>${esc(o.text)}\u003c/span>\u003c/button>`).join(''));return;\n }\n if(state===S.ANSWER_FEEDBACK){\n let f=game.feedback;prompt(f.success?'答題成功！':'這題需要再溫習',`${f.success?'✓ 答對了！':'✕ 兩次都未答對。'} ${e.q.explain}`,`正確答案：${L[e.correct]}. ${e.options[e.correct].text}${f.success?`　｜　能量 +${f.gain}`:'　｜　本回合無法攻擊'}`);\n const label=game.reviewOnly?'下一題 ▶':f.success?'選擇絕招 ▶':'下一回合 ▶';setChoices(`\u003cdiv class=\"panelActions\">\u003cspan class=\"bigMessage\" style=\"font-size:20px\">${f.success?`能量 ${t.energy} / 6`:'再接再厲！'}\u003c/span>${actionBtn(label,'feedbackNext')}\u003c/div>`);return;\n }\n if(state===S.SKILL_SELECT){prompt('選擇技能',`${t.mon} 準備攻擊！` ,`可用能量：${t.energy}/6 ｜ ${game.feedback.first?'首次答對：100% 傷害':'第二次答對：75% 傷害'}`);\n if(game.pendingMove!==null){const m=MOVESETS[activeTeam().species][game.pendingMove],d=Math.round(m.damage*(game.feedback.first?1:.75));\n setChoices(`\u003cdiv class=\"panelActions\">\u003cdiv class=\"confirmTitle\">${esc(t.mon)} 使用「${m.name}」？\u003csmall>傷害 ${d} HP　／　消耗 ${m.cost} 能量\u003c/small>\u003c/div>${actionBtn('返回選招','cancelMove','secondary')}${actionBtn('確定發動 ▶','confirmMove')}\u003c/div>`);return;}\n setChoices(MOVESETS[activeTeam().species].map((s,i)=>{let available=t.energy>=s.cost,dmg=Math.round(s.damage*(game.feedback.first?1:.75));return `\u003cbutton class=\"choice\" data-move=\"${i}\" ${!available?'disabled':''}>\u003cspan class=\"key\">${i+1}\u003c/span>\u003cspan class=\"skillInfo\">\u003cspan class=\"skillName\">${esc(s.name)}\u003c/span>\u003cspan class=\"skillMeta\">傷害 ${dmg}　⚡ 能量 ${s.cost}${!available?' · 不足':''}\u003c/span>\u003c/span>\u003c/button>`}).join(''));return;\n }\n if(state===S.ATTACK||state===S.DAMAGE){let a=game.animation,m=a?.move;prompt('技能發動',`${t.mon} 使用了「${m?.name||''}」！` ,`攻擊 ${game.teams[otherId(game.active)].mon} ｜ 傷害 ${a?.damage||0} 點　｜　動畫可按右上角跳過`);setChoices(`\u003cdiv class=\"panelActions\">\u003cspan class=\"bigMessage\" style=\"font-size:19px\">${a?.hit?`命中！受到 ${Math.min(a.fromHP,a.damage)} 點傷害！`:'蓄力中…'}\u003c/span>\u003c/div>`);return}\n if(state===S.TURN_END){let next=game.queue[game.index+1];prompt('回合完成',`${t.mon} 完成了本回合！`,next?`下一題輪到 ${game.teams[next.team].name} 的 ${game.teams[next.team].mon}。`:'10 道題目已全部作答。');setChoices(`\u003cdiv class=\"panelActions\">${actionBtn(next?'下一回合 ▶':'查看戰績 ▶','nextTurn')}\u003c/div>`);return}\n if(state===S.GAME_OVER){prompt('對戰結果',game.koWinner?'其中一隻寶可夢的 HP 已歸零！':'10 道科學題目已經全部完成！','請查看最後戰績，也可重溫答錯的題目。');setChoices(`\u003cdiv class=\"panelActions\">${actionBtn('查看戰績','showResults')}\u003c/div>`);return}\n if(state===S.REVIEW){prompt('錯題重溫','複習兩組答錯的科學題目','按成績畫面的返回按鈕可查看對戰結果。');setChoices(`\u003cdiv class=\"panelActions\">${actionBtn('返回戰績','showResults')}\u003c/div>`)}\n}\nfunction selectAnswer(i){if(game.paused||![S.QUESTION,S.RETRY].includes(game.state)||game.pendingAnswer!==null||!Number.isInteger(i)||i\u003c0||i>3||i===game.wrongChoice)return;game.pendingAnswer=i;renderUI()}\nfunction confirmAnswer(){if(game.paused||![S.QUESTION,S.RETRY].includes(game.state)||game.pendingAnswer===null)return;\n let entry=currentEntry(),idx=game.pendingAnswer;game.pendingAnswer=null;entry.attempts.push(idx);game.attempt++;\n if(idx!==entry.correct&&game.attempt===1){game.wrongChoice=idx;setState(S.RETRY);playSound('wrong');toast('答錯了！還有一次機會。');return}\n let success=idx===entry.correct,first=success&&game.attempt===1,gain=success?(first?2:1):0;\n entry.result=success?(first?'first':'second'):'failed';let t=activeTeam();\n if(first)t.stats.first++;else if(success)t.stats.second++;else t.stats.failed++;\n const energyBefore=t.energy;if(!game.reviewOnly)t.energy=Math.min(6,t.energy+gain);\n game.feedback={success,first,gain:game.reviewOnly?0:t.energy-energyBefore};setState(S.ANSWER_FEEDBACK);playSound(success?'correct':'wrong');\n if(success)burst(game.active==='A'?315:735,game.active==='A'?295:160,34,success?['#fff1a1','#ffe055','#8bf5fe']:['#e2b0ef']);\n}\nfunction feedbackNext(){if(game.paused||game.state!==S.ANSWER_FEEDBACK)return;if(game.feedback.success&&!game.reviewOnly){setState(S.SKILL_SELECT)}else{setState(S.TURN_END)}}\nfunction selectMove(i){if(game.paused||game.state!==S.SKILL_SELECT||game.pendingMove!==null)return;const m=MOVESETS[activeTeam().species][i];if(!m||activeTeam().energy\u003cm.cost)return;game.pendingMove=i;renderUI()}\nfunction chooseMove(i){if(game.state!==S.SKILL_SELECT||game.paused||game.animation)return;const m=MOVESETS[activeTeam().species][i],t=activeTeam();if(!m||t.energy\u003cm.cost)return;\n const damage=Math.round(m.damage*(game.feedback.first?1:.75));game.pendingMove=null;t.energy-=m.cost;t.stats.skills.push(m.name);\n game.animation={move:m,from:game.active,to:otherId(game.active),damage,elapsed:0,duration:game.settings.reduced?Math.min(m.duration,1800):m.duration,hit:false,started:false,events:new Set()};\n setState(S.ATTACK);playSound('announce');\n}\nfunction applyHit(anim){if(anim.hit)return;anim.hit=true;anim.hitTime=game.clock;let defender=game.teams[anim.to],attacker=game.teams[anim.from];\n let damage=Math.min(defender.hp,anim.damage),hpFrom=defender.hp;defender.hp=Math.max(0,defender.hp-damage);attacker.stats.attacks++;attacker.stats.totalDamage+=damage;\n anim.hitAt=anim.elapsed;anim.fromHP=hpFrom;anim.toHP=defender.hp;game.damageFloat={x:anim.to==='A'?290:728,y:anim.to==='A'?315:160,value:'-'+damage,born:game.clock,color:anim.from==='A'?'#ffe48a':'#eac3ff'};\n const pos=anim.to==='A'?[295,314]:[735,173];burst(pos[0],pos[1],game.settings.reduced?18:48,anim.from==='A'?['#ffdc4c','#fffcef','#71e4f4']:['#bd7bff','#f3caff','#8bcbff']);\n game.scenePulse=game.settings.reduced?0:.20;canvasShake=game.settings.reduced?0:anim.move.damage>=23?11:6;game.state=S.DAMAGE;playSound('hit');playSound('hp');renderUI();\n}\nfunction finishAttack(){let a=game.animation;if(!a)return;if(!a.hit)applyHit(a);game.teams[a.to].displayHp=game.teams[a.to].hp;game.animation=null;game.scenePulse=0;\n if(game.teams[a.to].hp===0){game.teams[a.to].fainted=true;game.faintTime=game.clock;game.koWinner=a.from;endGame(true)}else setState(S.TURN_END);\n}\nfunction nextTurn(){if(game.state!==S.TURN_END||game.paused)return;\n game.index++;if(game.index>=game.queue.length){endGame(false);return}\n startQuestion();}\nfunction startQuestion(){game.active=currentEntry().team;game.attempt=0;game.wrongChoice=null;game.pendingAnswer=null;game.feedback=null;setState(S.QUESTION);playSound('turn');}\nfunction endGame(byKo){game.animation=null;game.paused=false;game.state=S.GAME_OVER;game.outro={started:game.clock,duration:2000};renderUI();showOverlay('');playSound(winnerId()?'victory':'draw');\n const winner=winnerId();if(winner){if(!game.faintTime)game.faintTime=game.clock;burst(winner==='A'?298:716,winner==='A'?255:157,85,winner==='A'?['#ffdb3e','#fff4a3','#fff']:['#cb9eff','#9b67ec','#f5d7ff'])}else burst(500,160,70,['#eee5ff','#ffe1ac','#b4faff']);}\nfunction winnerId(){if(game.koWinner)return game.koWinner;let a=game.teams.A,b=game.teams.B;if(a.hp!==b.hp)return a.hp>b.hp?'A':'B';if(a.stats.first!==b.stats.first)return a.stats.first>b.stats.first?'A':'B';return null}\nfunction favoriteSkill(t){let counts={};for(const k of t.stats.skills)counts[k]=(counts[k]||0)+1;let ordered=Object.entries(counts).sort((a,b)=>b[1]-a[1]);return ordered.length?ordered.filter(x=>x[1]===ordered[0][1]).map(x=>`${x[0]} ×${x[1]}`).join('、'):'未使用'}\nfunction resultsHtml(){let a=game.teams.A,b=game.teams.B,winner=winnerId(),result=winner?`${esc(game.teams[winner].name)} 勝利！`:'勢均力敵！';let left=game.queue.length-game.queue.filter(e=>e.result!==null).length;\n co p\u003c.88){\n  const fade=1-clamp((p-a.move.hit)/.18);\n  if(tier===0){\n   if(fire){for(let i=0;i\u003c3;i++)line(c,[[target.x-35+i*22,ty+28],[target.x+2+i*22,ty-27]],palette[2],5);}\n   else fxImage(c,'impact',target.x,ty,106,106,progress*fade);\n  }else if(!fire&&tier===1){\n   for(let i=0;i\u003c2;i++){\n    const points=[];\n    for(let j=0;j\u003c=16;j++){\n     const u=j/16*progress;\n     points.push([mix(source.x,target.x,u),mix(sy,ty,u)+Math.sin(u*9+now*.018)*Math.sin(u*Math.PI)*(i?25:-25)]);\n    }\n    line(c,points,palette[0],12);line(c,points,color,5);\n   }\n  }else if(!fire&&tier===3){\n   const x=mix(source.x,target.x,progress),y=mix(sy,ty,progress);\n   line(c,[[source.x,sy],[x,y]],palette[0],48*fade);\n   line(c,[[source.x,sy],[x,y]],color,30*fade);\n   line(c,[[source.x,sy],[x,y]],palette[2],13*fade);\n  }else{\n   const count=tier===1?4:tier===2?12:7;\n   for(let i=0;i\u003ccount;i++){\n    const u=clamp(progress-i*.035), x=mix(source.x,target.x,u);\n    const y=mix(sy,ty,u)+Math.sin(u*Math.PI)*(i%3-1)*(tier===3?72:34);\n    const size=(tier===3?27:12)+i%3*5;\n    if(fire){\n     ellipse(c,x,y,size*fade,size*.72*fade,palette[0]);\n     ellipse(c,x,y,size*.70*fade,size*.48*fade,color);\n     ellipse(c,x,y,size*.32*fade,size*.29*fade,palette[2]);\n    }else{\n     c.save();c.translate(x,y);c.rotate(now*.012+i);\n     polygon(c,[[-size,0],[0,-size*.45],[size,0],[0,size*.45]],color,palette[0],2);\n     c.restore();\n    }\n   }\n  }\n }\n if(p>=a.move.hit&&p\u003ca.move.hit+.23){\n  const age=(p-a.move.hit)/.23;\n  fxImage(c,'impact',target.x,ty,90+tier*26,90+tier*26,1-age);\n  ring(c,target.x,ty,22+age*(70+tier*24),color,5);\n }\n}\n\nconst ORIGINAL_FX={quick:fxQuick,shock:fxShock,bolt:fxBolt,volt:fxVolt,confusion:fxConfusion,psychic:fxPsychic,aura:fxAura,psystrike:fxPsystrike};\nfunction drawAttackFX(c,a,p,now){\n c.save();\n const fx=ORIGINAL_FX[a.move.id];\n if(!fx)elementalFX(c,a,p,now);\n else{\n  const originalSide=MOVESETS.A.includes(a.move)?'A':'B';\n  if(a.move.id!=='quick'&&a.from!==originalSide){\n   c.translate(1010,450);c.scale(-1,-1);\n   fx(c,{...a,to:otherId(a.to)},p,now);\n  }else fx(c,a,p,now);\n }\n c.restore();\n}\n/* ==================== Canvas particles and game loop ==================== */\nfunction burst(x,y,n,colors){n=game.settings.reduced?Math.min(n,8):n;for(let i=0;i\u003cn;i++){let angle=Math.random()*Math.PI*2,speed=40+Math.random()*225,life=.45+Math.random()*1;\n game.particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-54,size:3+Math.floor(Math.random()*5),color:colors[i%colors.length],rot:Math.random()*5,vr:(Math.random()-.5)*9,life,maxLife:life});}\n if(game.particles.length>380)game.particles.splice(0,game.particles.length-380)}\nfunction particleTick(dt){for(let i=game.particles.length-1;i>=0;i--){let p=game.particles[i];p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.vy+=150*dt/1000;p.vx*=.992;p.rot+=p.vr*dt/1000;p.life-=dt/1000;if(p.life\u003c=0)game.particles.splice(i,1)}}\nfunction fireEvent(a,label,threshold,fn,p){if(p>=threshold&&!a.events.has(label)){a.events.add(label);fn()}}\nfunction stepAttack(dt){const a=game.animation;if(!a)return;a.elapsed+=dt;let p=attackProgress(a);\n fireEvent(a,'charge',.12,()=>{playSound(['quick','volt','shock','bolt'].includes(a.move.id)?'chargeElectric':'chargePsychic');let src=a.from==='A'?[290,289]:[716,150];burst(...src,13,a.from==='A'?['#fff2aa','#ffe54b']:['#e3aeff','#aa78ef'])},p);\n fireEvent(a,'launch',.41,()=>{playSound({scratch:'quick',tackle:'quick',ember:'shock',flamethrower:'bolt',fireblast:'volt',vinewhip:'confusion',razorleaf:'psychic',solarbeam:'aura'}[a.move.id]||a.move.id);let src=a.from==='A'?[362,279]:[666,172];burst(...src,18,a.from==='A'?['#fff1a7','#ffce2e','#9be9fb']:['#d08dfb','#7baaff','#f0c4fc'])},p);\n if(p>=a.move.hit&&!a.hit){applyHit(a);a.hitTime=game.clock}\n if(a.hit){let t=clamp((a.elapsed-a.hitAt)/Math.max(220,game.settings.reduced?170:570));game.teams[a.to].displayHp=mix(a.fromHP,a.toHP,ease(t))}\n if(a.elapsed>=a.duration)finishAttack();\n}\nfunction setBattleMsg(){let el=$('battleMsg'),a=game.animation;if([S.ATTACK,S.DAMAGE].includes(game.state)&&a){el.textContent=`${game.teams[a.from].mon}使用了${a.move.name}！`;el.classList.toggle('show',a.elapsed\u003c760)}else if(game.state===S.GAME_OVER&&game.outro){let w=winnerId();el.textContent=w?`${game.teams[w].name} 勝利！`:'勢均力敵！';el.classList.add('show')}else el.classList.remove('show')}\nfunction loop(ts){const dt=Math.min(60,ts-lastTime||0);lastTime=ts;\n if(!game.paused){game.clock+=dt;particleTick(dt);game.scenePulse=Math.max(0,game.scenePulse-dt*.0007);canvasShake=Math.max(0,canvasShake-dt*.028);\n if(game.state===S.BATTLE_INTRO&&game.clock>=game.introEnd)startQuestion();\n if(game.state===S.ATTACK||game.state===S.DAMAGE)stepAttack(dt);\n if(game.outro&&game.clock-game.outro.started>=game.outro.duration)showResults();\n if(toastHide&&game.clock>toastHide){$('toast').classList.remove('show');toastHide=0}\n }\n renderWorld(game.clock);setBattleMsg();if(ts-lastUiRefresh>60){updateHud();lastUiRefresh=ts}\n requestAnimationFrame(loop);\n}\n/* ==================== Web Audio API 原創 8-bit 音效／旋律 ==================== */\nlet audioContext=null,sfxGain=null,musicGain=null,musicTimer=null,musicStep=0;\nfunction syncAudio(){try{if(!audioContext)return;if(sfxGain)sfxGain.gain.setValueAtTime(game.settings.sound?1:0,audioContext.currentTime);if(musicGain)musicGain.gain.setValueAtTime(game.settings.music?1:0,audioContext.currentTime)}catch(e){}}\nfunction unlockAudio(){try{if(!audioContext){const C=window.AudioContext||window.webkitAudioContext;if(C){audioContext=new C();sfxGain=audioContext.createGain();musicGain=audioContext.createGain();sfxGain.connect(audioContext.destination);musicGain.connect(audioContext.destination);syncAudio()}}if(audioContext?.state==='suspended'&&!game.paused)audioContext.resume().catch(()=>{})}catch(e){}}\nfunction tone(freq,duration=.12,type='square',volume=.035,when=0,bend=0,bus='sfx'){\n try{if(!audioContext||(bus==='sfx'&&!game.settings.sound)||(bus==='music'&&!game.settings.music))return;\n const now=audioContext.currentTime+when,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(25,freq),now);if(bend)o.frequency.exponentialRampToValueAtTime(Math.max(25,freq+bend),now+duration);\n g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(g);g.connect(bus==='music'?musicGain:sfxGain);o.start(now);o.stop(now+duration+.015);o.onended=()=>{o.disconnect();g.disconnect()};}catch(e){}\n}\nfunction fuzz(duration=.17,volume=.025){try{if(!audioContext||!game.settings.sound)return;let size=Math.ceil(audioContext.sampleRate*duration),buffer=audioContext.createBuffer(1,size,audioContext.sampleRate),data=buffer.getChannelData(0);for(let i=0;i\u003csize;i++){data[i]=(Math.random()*2-1)*Math.pow(1-i/size,1.9)}let src=audioContext.createBufferSource(),filter=audioContext.createBiquadFilter(),gain=audioContext.createGain();src.buffer=buffer;filter.type='highpass';filter.frequency.value=280;gain.gain.value=volume;src.connect(filter);filter.connect(gain);gain.connect(sfxGain);src.start();src.onended=()=>{src.disconnect();filter.disconnect();gain.disconnect()}}catch(e){}}\nfunction playSound(type){if(!game.settings.sound)return;unlockAudio();switch(type){\n case 'start':[392,494,587,784].forEach((f,i)=>tone(f,.12,'square',.04,i*.11));break;\n case 'turn':tone(570,.075,'square',.025);tone(740,.11,'square',.025,.085);break;\n case 'correct':[523,659,784,1046].forEach((f,i)=>tone(f,.12,'square',.032,i*.08));break;\n case 'wrong':tone(280,.12,'sawtooth',.027,0,-95);tone(180,.18,'square',.02,.12);break;\n case 'announce':tone(390,.07,'triangle',.02);tone(540,.09,'square',.018,.07);break;\n case 'chargeElectric':for(let i=0;i\u003c9;i++)tone(220+i*75,.06,'sawtooth',.009,i*.044,90);break;\n case 'chargePsychic':for(let i=0;i\u003c7;i++)tone(130+i*57,.11,'sine',.026,i*.065,100);break;\n case 'quick':tone(520,.22,'sawtooth',.045,0,-425);fuzz(.14,.02);break;\n case 'shock':for(let i=0;i\u003c7;i++)tone(i%2?1040:340,.065,'square',.023,i*.038);break;\n case 'bolt':for(let i=0;i\u003c13;i++)tone(i%2?1250:420,.07,'sawtooth',.025,i*.04,-220);fuzz(.4,.03);break;\n case 'volt':for(let i=0;i\u003c12;i++)tone(240+i*100,.09,'sawtooth',.023,i*.047,-160);fuzz(.46,.048);break;\n case 'confusion':for(let i=0;i\u003c6;i++)tone(440-i*35,.22,'sine',.02,i*.07,190);break;\n case 'psychic':for(let i=0;i\u003c10;i++)tone(180+i*54,.16,'triangle',.027,i*.04,220);break;\n case 'aura':for(let i=0;i\u003c8;i++)tone(170+i*86,.12,'sine',.026,i*.063,180);fuzz(.12,.01);break;\n case 'psystrike':for(let i=0;i\u003c12;i++)tone(220+i*37,.13,'sawtooth',.025,i*.07,-100);fuzz(.5,.04);break;\n case 'hit':tone(130,.17,'sawtooth',.055,0,-100);tone(83,.26,'triangle',.04,.035,-50);fuzz(.22,.04);break;\n case 'hp':for(let i=0;i\u003c6;i++)tone(220-i*16,.025,'triangle',.012,.11+i*.065);break;\n case 'draw':[392,494,587,494,392].forEach((f,i)=>tone(f,.16,'triangle',.025,i*.13));break;\n case 'victory':[523,659,784,1046,784,1046,1175].forEach((f,i)=>tone(f,.18,'square',.035,i*.12));break;\n}}\nconst melody=[392,0,523,587,659,587,523,0,349,0,440,523,587,523,440,0,392,494,587,0,659,0,784,659,587,523,440,0,392,0,349,0];\nfunction startMusic(){stopMusic();unlockAudio();musicStep=0;musicTimer=setInterval(()=>{if(!game.settings.music||game.paused||!audioContext||![S.BATTLE_INTRO,S.QUESTION,S.RETRY,S.ANSWER_FEEDBACK,S.SKILL_SELECT,S.TURN_END].includes(game.state))return;let f=melody[musicStep%melody.length];if(f){tone(f,.13,'triangle',.012,0,0,'music');if(musicStep%4===0)tone(f/2,.17,'sine',.012,.02,0,'music');}musicStep++},195)}\nfunction stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}\n/* QA-friendly, non-mutating diagnostic snapshot, remains fully offline */\nwindow.__battleQA={snapshot:()=>({state:game.state,index:game.index,active:game.active,attempt:game.attempt,reviewOnly:game.reviewOnly,koWinner:game.koWinner,questionId:currentEntry()?.q?.id??null,correctChoice:currentEntry()?.correct??null,answers:game.queue.map(e=>({id:e.q.id,team:e.team,result:e.result})),A:{hp:game.teams.A.hp,energy:game.teams.A.energy,stats:{...game.teams.A.stats,skills:[...game.teams.A.stats.skills]}},B:{hp:game.teams.B.hp,energy:game.teams.B.energy,stats:{...game.teams.B.stats,skills:[...game.teams.B.stats.skills]}}})};\ntry{game.settings.reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches||false}catch(e){}\ndocument.addEventListener('visibilitychange',()=>{if(document.hidden&&!game.paused&&!$('pauseBtn').disabled)$('pauseBtn').click()});\n$('pauseMask').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('pauseBtn').click()}};\nupdateHud();overlayMenu();requestAnimationFrame(loop);\n\u003c/script>\n\u003c/body>\u003c/html>\n"}, "nature": {"title": "第四課｜動植物與環境（單人小遊戲）", "html": "\u003c!doctype html>\u003chtml lang=\"zh-Hant\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\u003ctitle>星際科學戰機\u003c/title>\n\u003cstyle>\n:root{color-scheme:dark;--cyan:#69f5ed;--ink:#071324;--gold:#ffd479;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172e53,#040812 72%);color:#eafaff;min-height:100dvh;display:grid;place-items:center}#cab{width:min(100%,570px,calc(100dvh * .86));min-width:min(100%,320px);border:1px solid #365676;background:#081326;box-shadow:0 0 64px #0009}header,footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px}header{border-bottom:1px solid #34536d}header b{color:var(--cyan);letter-spacing:.09em}button,select,input[type=number]{font:inherit;color:inherit;background:#112746;border:1px solid #51728b;border-radius:6px;padding:.52em .72em}button{cursor:pointer}button:hover,button:focus-visible{border-color:var(--cyan);background:#204263}button.primary{background:var(--cyan);color:#052126;border-color:var(--cyan);font-weight:900}#stage{position:relative;isolation:isolate}canvas{display:block;width:100%;aspect-ratio:480/620;image-rendering:pixelated;touch-action:none;background:#030918}#hud{position:absolute;inset:8px 10px auto;pointer-events:none;font-size:clamp(10px,2.8vw,13px);text-shadow:0 2px #020917}#stats{display:flex;justify-content:space-between;gap:4px;color:var(--cyan);font-weight:800}#gear{margin-top:4px;color:#deebff}#bossbar{margin-top:5px;border:1px solid #e65c8e;background:#331528;height:8px}#bossfill{height:100%;background:linear-gradient(90deg,#ff4386,#ffb072)}#bosslabel{color:#ffb2cb}#overlay{position:absolute;inset:0;display:grid;align-items:center;align-items:safe center;padding:clamp(7px,3vw,20px);background:#030819b8;overflow:auto}#overlay[hidden], [hidden]{display:none!important}#card{width:100%;padding:clamp(10px,3vw,22px);border:1px solid #5793aa;border-top:4px solid var(--cyan);background:linear-gradient(145deg,#152b48,#0a1629 68%);box-shadow:0 16px 35px #0008;border-radius:8px}#card.final{border-color:var(--gold);box-shadow:0 0 35px #ffbb5550;animation:signal 1.6s infinite alternate}@keyframes signal{to{box-shadow:0 0 38px #ffbb5580}}@media(prefers-reduced-motion:reduce){#card.final{animation:none}}.eyebrow{color:var(--cyan);font:800 .73rem monospace;letter-spacing:.16em}h1,h2,p{margin:.45em 0}h1{font-size:clamp(23px,5vw,42px);line-height:1.1}h2{font-size:clamp(17px,3.7vw,24px)}p,small{color:#c8dbef}small{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.grid label{display:grid;gap:3px;font-size:.82rem;min-width:0}.grid input,.grid select{width:100%}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.choices{display:grid;gap:6px;margin-top:10px}.choices button{text-align:left;overflow-wrap:anywhere}.answer-good{color:var(--gold)}.answer-bad{color:#ff9cae}#banknote{color:var(--gold);margin-top:6px}footer{font-size:.72rem;color:#acc2da;flex-wrap:wrap}#file{display:none}#cab:fullscreen{width:min(100%,calc(100dvh * .76));margin:auto;display:flex;flex-direction:column;justify-content:center}.screen-mode{position:fixed;inset:0;z-index:5;margin:auto;width:min(100%,calc(100dvh * .76))!important;height:max-content;box-shadow:0 0 0 100vmax #030814!important}#transition{pointer-events:none}\n\u003c/style>\n\u003cmain id=\"cab\">\u003cheader>\u003cb>✦ 星際科學戰機\u003c/b>\u003cdiv>\u003cbutton id=\"pause\" aria-label=\"暫停\" disabled>Ⅱ\u003c/button> \u003cbutton id=\"full\" aria-label=\"切換全螢幕\">⛶\u003c/button>\u003c/div>\u003c/header>\n\u003cdiv id=\"stage\">\u003ccanvas id=\"game\" width=\"480\" height=\"620\" aria-label=\"星際射擊戰場\">\u003c/canvas>\u003cdiv id=\"hud\" hidden>\u003cdiv id=\"stats\">\u003c/div>\u003cdiv id=\"gear\">\u003c/div>\u003cdiv id=\"bossbar\" hidden>\u003cdiv id=\"bossfill\">\u003c/div>\u003c/div>\u003csmall id=\"bosslabel\">\u003c/small>\u003c/div>\u003cdiv id=\"overlay\">\u003csection id=\"card\" aria-live=\"polite\">\u003c/section>\u003c/div>\u003c/div>\n\u003cfooter>\u003cspan>方向鍵／WASD 移動 · Space 射擊\u003c/span>\u003cspan>觸控拖曳 · 自動射擊\u003c/span>\u003c/footer>\u003c/main>\n\u003cscript>\n'use strict';\nconst $=id=>document.getElementById(id);\nconst canvas=$('game'), ctx=canvas.getContext('2d'), W=480,H=620;\nconst classroomBank=[\n ['地球上有那種自然環境？舉出一個。',['魚塘','公園','熱帶雨林','運動場'],'C','熱帶雨林是自然形成的環境。'],\n ['駱駝的駝峰主要用來儲存甚麼？',['水分','脂肪','空氣','鹽分'],'B','駝峰儲存脂肪，駱駝可在食物不足時利用脂肪獲取能量。'],\n ['仙人掌擁有「肥厚的莖」和「呈刺狀的葉」主要作用是甚麼?',['莖減少水分流失，葉儲存水分','莖吸收土壤中的水分，葉儲存水分','莖儲存水分，葉吸收土壤中的水分','莖儲存水分，葉減少水分流失'],'D','肥厚的莖能儲存水分。葉呈刺狀，表面積較小，有助減少水分流失。'],\n ['寫出一種在沙漠生活的動物。',['狐獴','北極狐','大熊貓','企鵝'],'A','狐獴能在非洲南部的沙漠等乾燥環境生活。'],\n ['北極熊和海象擁有一層厚厚的皮下脂肪，這是為了甚麼？',['增加身體散熱的速度','增加皮膚吸收水分的速度','以保存體溫','減少身體在水中的浮力'],'C','皮下脂肪有保溫作用，能減慢熱量散失。'],\n ['刺蝟會怎樣減少能量消耗？',['增加活動時間','進入冬眠，讓身體活動減慢','每天走更遠的路尋找食物','加快呼吸和心跳'],'B','會冬眠的刺蝟在冬眠時心跳和呼吸減慢，消耗的能量也會減少。'],\n ['老虎是生活在那個自然環境？',['濕地','極地','沙漠','熱帶雨林'],'D','老虎可以生活在熱帶雨林，也有老虎生活在紅樹林濕地，例如孫德爾本斯。',['A']],\n ['那一個自然環境是位於陸地與水的交界？',['濕地','沙漠','温帶草原','熱帶雨林'],'A','陸地與水域交界可形成濕地，泥土常含有大量水分，地面有時會被水淹浸。'],\n ['熱帶雨林的樹的巨大板根是用來做什麼?',['儲存水分','固定樹幹','吸收陽光','減少水分流失'],'B','板根像支架一樣向外伸展，讓高大的樹站得更穩。'],\n ['為甚麼温帶草原的植物有廣闊的根？',['讓根接觸更多陽光','讓葉片散失更多水分','增加水分吸收','固定樹幹'],'C','根向四周伸展，可以從更大範圍的土壤吸收水分。']\n].map(([question,options,answer,explanation,alternatives])=>({question,options,answer,explanation,alternatives}));\nconst labels=['外星入侵','星際反擊','宇宙危機','母艦決戰'];\nconst gearInfo={\n double:['雙重射擊','#61f4ff','Ⅱ'],triple:['三重射擊','#ff9b6c','Ⅲ'],rapid:['高速射擊','#96ff9a','»'],\n laser:['雷射炮','#fb86ff','│'],shield:['能量護盾','#7a9fff','◇'],missile:['追蹤導彈','#ffd15c','↑']\n};\nconst types=Object.keys(gearInfo);\nconst colors=['#8bfcb8','#61ecff','#e4a2ff','#ffad6a','#ff6386'];\nconst sprites=[\n ['001000100','000101000','001111100','011010110','111111111','101111101','101000101','000101000'],\n ['000010000','100111001','110111011','011101110','001111100','000101000'],\n ['001111100','011111110','111010111','110111011','111111111','011010110','010000010'],\n ['100010001','110111011','011111110','111010111','101111101','100101001','000101000'],\n ['100000001','110010011','011111110','001010100','001111100','011010110','000101000']\n];\nconst shipSprite=['00000100000','00001110000','00001210000','00011211000','00111211100','01111111110','11101110111','11001110011','10001010001'];\nconst cfg={difficulty:'easy',interval:10,lives:3,order:'fixed',shuffle:false,mode:'class',sfx:true,music:false};\nlet bank=classroomBank, bankName='小四科學 · 自然環境與生物適應 · 10 題', importError='', loading=false, importVersion=0;\nlet state='menu', run=null, last=0, clock=0, touch=null, keys=new Set(), showFrom='fight';\nconst rnd=(a,b)=>a+Math.random()*(b-a);\nconst clamp=(x,a,b)=>Math.max(a,Math.min(b,x));\nconst shuffle=a=>{const result=[...a];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result};\nconst stars=Array.from({length:105},()=>({x:rnd(0,W),y:rnd(0,H),z:rnd(.2,1),tw:rnd(0,7)}));\nlet audio=null, beat=0, musicTime=0;\nfunction unlockAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio ||= new AC();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch{}}\nfunction tone(f,end,len,vol=.05,wave='square',delay=0){\n if(!audio||audio.state!=='running')return;\n const t=audio.currentTime+delay, oscillator=audio.createOscillator(), gain=audio.createGain();\n oscillator.type=wave;oscillator.frequency.setValueAtTime(f,t);oscillator.frequency.exponentialRampToValueAtTime(end,t+len);\n gain.gain.setValueAtTime(vol,t);gain.gain.exponentialRampToValueAtTime(.001,t+len);\n oscillator.connect(gain);gain.connect(audio.destination);oscillator.start(t);oscillator.stop(t+len);\n}\nfunction sound(name){\n if(!cfg.sfx)return;\n const sounds={shot:[380,130,.08,.022],blast:[140,35,.16,.045],hurt:[180,48,.27,.07],bad:[280,78,.32,.055],warn:[550,190,.22,.07],boss:[110,28,.85,.095],beam:[470,55,.4,.05]};\n if(sounds[name])tone(...sounds[name],name==='blast'?'sawtooth':'square');\n else (name==='win'?[262,330,392,523,659]:name==='rare'?[392,523,784,1047]:[440,554,740]).forEach((f,i)=>tone(f,f,.14,.042,'triangle',i*.085));\n}\nfunction panel(html,style=''){\n $('card').className=style;$('card').innerHTML=html;$('overlay').hidden=false;\n}\nfunction hidePanel(){$('overlay').hidden=true}\nfunction click(id,fn){$(id).onclick=fn}\nfunction select(id,value){$(id).value=value;$(id).onchange=e=>{cfg[id]=e.target.value}}\nfunction checked(id){$(id).checked=cfg[id];$(id).onchange=e=>{cfg[id]=e.target.checked;unlockAudio()}}\nfunction number(id,min,max){\n const field=$(id);field.value=cfg[id];field.onchange=()=>{\n  cfg[id]=clamp(Math.round(Number(field.value)||cfg[id]),min,max);field.value=cfg[id];\n };\n}\nfunction menu(){\n state='menu';run=null;touch=null;keys.clear();$('hud').hidden=true;$('pause').disabled=true;\n panel('\u003cdiv class=\"eyebrow\">SCIENCE ARCADE / 01\u003c/div>\u003ch1>星際科學戰機\u003c/h1>\u003cp>擊退外星敵機，完成 10 道科學挑戰。\u003c/p>\u003cdiv class=\"grid\">'+\n '\u003clabel>難度\u003cselect id=\"difficulty\">\u003coption value=\"easy\">簡單\u003c/option>\u003coption value=\"normal\">普通\u003c/option>\u003coption value=\"hard\">困難\u003c/option>\u003c/select>\u003c/label>'+\n '\u003clabel>模式\u003cselect id=\"mode\">\u003coption value=\"class\">課堂模式\u003c/option>\u003coption value=\"challenge\">挑戰模式\u003c/option>\u003c/select>\u003c/label>'+\n '\u003clabel>問答間隔（秒）\u003cinput id=\"interval\" type=\"number\" min=\"3\" max=\"90\">\u003c/label>'+\n '\u003clabel>初始生命\u003cinput id=\"lives\" type=\"number\" min=\"1\" max=\"9\">\u003c/label>'+\n '\u003clabel>出題次序\u003cselect id=\"order\">\u003coption value=\"fixed\">固定\u003c/option>\u003coption value=\"random\">隨機\u003c/option>\u003c/select>\u003c/label>'+\n '\u003clabel>\u003cspan>\u003cinput id=\"shuffle\" type=\"checkbox\"> 打亂選項\u003c/span>\u003cspan>\u003cinput id=\"sfx\" type=\"checkbox\"> 音效 \u003cinput id=\"music\" type=\"checkbox\"> 音樂\u003c/span>\u003c/label>\u003c/div>'+\n '\u003csmall id=\"banknote\">\u003c/small>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" id=\"start\">開始任務\u003c/button>\u003cbutton id=\"import\">匯入題庫\u003c/button>\u003cbutton id=\"template\">下載範本\u003c/button>\u003c/div>');\n for(const id of ['difficulty','mode','order'])select(id,cfg[id]);\n for(const id of ['shuffle','sfx','music'])checked(id);\n number('interval',3,90);number('lives',1,9);\n $('banknote').textContent=importError||bankName;$('start').disabled=Boolean(importError||loading);\n click('start',()=>{if(!importError&&!loading){unlockAudio();start()}});\n click('import',()=>$('file').click());\n click('template',()=>{\n  const url=URL.createObjectURL(new Blob([JSON.stringify(classroomBank,null,2)],{type:'application/json'}));\n  const a=document.createElement('a');a.href=url;a.download='science-question-template.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);\n });\n}\nfunction validate(data){\n if(!Array.isArray(data)||data.length!==10)throw Error('題庫須為 JSON 陣列，並剛好有 10 題。');\n const seen=new Set();\n return data.map((q,i)=>{\n  const fail=message=>{throw Error('第 '+(i+1)+' 題：'+message)};\n  const valid=x=>typeof x==='string'&&x.trim().length>0;\n  if(!q||!valid(q.question)||!valid(q.explanation))fail('缺少題目或解說。');\n  if(!Array.isArray(q.options)||q.options.length!==4||!q.options.every(valid)||new Set(q.options.map(x=>x.trim())).size!==4)fail('須有四個不同選項。');\n  if(typeof q.answer!=='string'||! /^[A-D]$/.test(q.answer))fail('答案須為 A、B、C 或 D。');\n  const key=q.question.trim().normalize('NFKC').replace(/\\s+/g,'');\n  if(seen.has(key))fail('題目重複。');\n  const alternatives=q.alternatives===undefined?[]:q.alternatives;\n  if(!Array.isArray(alternatives)||alternatives.some(a=>typeof a!=='string'||! /^[A-D]$/.test(a)||a===q.answer)||new Set(alternatives).size!==alternatives.length)fail('可接受的其他答案須使用不同的 A–D 選項。');\n  seen.add(key);return {question:q.question,options:[...q.options],answer:q.answer,explanation:q.explanation,alternatives};\n });\n}\nconst file=document.createElement('input');file.type='file';file.accept='.json,application/json';file.id='file';document.body.append(file);\nfile.onchange=async()=>{\n const source=file.files[0];file.value='';if(!source)return;\n const version=++importVersion;loading=true;importError='正在檢查題庫…';menu();\n try{\n  if(source.size>2000000)throw Error('題庫檔案超過 2 MB。');\n  const raw=await source.text();if(version!==importVersion)return;\n  bank=validate(JSON.parse(raw.replace(/^\\uFEFF/,'')));bankName='已載入題庫 · '+source.name;importError='';\n }catch(e){if(version!==importVersion)return;importError=e instanceof SyntaxError?'無法讀取 JSON，請使用範本格式。':e.message}\n loading=false;menu();\n if(importError){\n  const reset=document.createElement('button');reset.textContent='使用原有有效題庫';reset.onclick=()=>{importError='';menu()};$('card').append(reset);\n }\n};\nfunction start(){\n const questions=validate(bank).map(q=>{\n  const indices=cfg.shuffle?shuffle([0,1,2,3]):[0,1,2,3];\n  const position=letter=>indices.indexOf('ABCD'.indexOf(letter));\n  return {...q,options:indices.map(i=>q.options[i]),correct:position(q.answer),accepted:[q.answer,...q.alternatives].map(position)};\n });\n run={questions:cfg.order==='random'?shuffle(questions):questions,answered:0,right:0,wrong:0,stage:0,score:0,kills:0,picked:0,lost:0,\n  elapsed:0,questionTime:0,touchAuto:window.matchMedia('(any-pointer: coarse)').matches||navigator.maxTouchPoints>0,mode:cfg.mode,interval:cfg.interval,difficulty:{easy:.75,normal:1,hard:1.28}[cfg.difficulty],\n  player:{x:W/2,y:H-49,life:cfg.lives,inv:0,tilt:0,cool:0,missile:0,flash:0},gear:[],drops:[],shots:[],hazards:[],enemies:[],fx:[],rings:[],\n  boss:null,spawn:.18,formation:0,shake:0,transition:0,pending:null,showFinal:false,boost:0,notice:'',noticeTime:0};\n keys.clear();touch=null;state='fight';$('hud').hidden=false;$('pause').disabled=false;hidePanel();updateHud();\n}\nfunction updateHud(){\n if(!run)return;\n const r=run;\n $('stats').textContent='分數 '+r.score.toString().padStart(5,'0')+'  ｜  第 '+(r.stage+1)+' 關  ｜  生命 '+r.player.life+'  ｜  答題 '+r.answered+'/10';\n const items=types.map(k=>[k,level(k)]).filter(([,lv])=>lv);\n $('gear').textContent=items.length?items.map(([k,lv])=>gearInfo[k][0]+' Lv.'+lv+(rare(k)?'★':'')+(k==='shield'?' ['+shieldCharges()+']':'')).join(' · '):'武器：基礎雷射';\n const boss=r.boss;$('bossbar').hidden=!boss;\n if(boss)$('bossfill').style.width=(Math.max(0,boss.hp)/boss.max*100)+'%';\n $('bosslabel').textContent=boss?'母艦 P'+boss.phase+(boss.hp\u003c=boss.max*.2&&r.answered\u003c10||boss.shield>0?' · 防禦護盾':''):'';\n}\nconst level=k=>run.gear.filter(g=>g.type===k).length;\nconst rare=k=>run.gear.some(g=>g.type===k&&g.rare);\nconst shieldCharges=()=>run.gear.reduce((n,g)=>n+(g.charges||0),0);\nfunction challenge(){\n state='question';touch=null;keys.clear();\n const r=run, q=r.questions[r.answered], final=r.answered===9;\n if(final){r.showFinal=true;r.boss.finalDefense=true;sound('warn')}\n panel('\u003cdiv class=\"eyebrow\">'+(final?'FINAL SCIENCE CHALLENGE！':'SCIENCE CHALLENGE！')+'\u003c/div>\u003csmall>第 '+(r.answered+1)+'／10 題 · '+labels[r.stage]+'\u003c/small>\u003ch2 id=\"question\">\u003c/h2>\u003cdiv class=\"choices\" id=\"choices\">\u003c/div>',final?'final':'');\n $('question').textContent=q.question;\n q.options.forEach((option,i)=>{\n  const b=document.createElement('button');b.textContent='ABCD'[i]+'. '+option;b.onclick=()=>answer(i);$('choices').append(b);\n });\n $('choices').firstChild.focus({preventScroll:true});\n}\nfunction reward(final){\n const r=run;\n const type=r.answered\u003c=6?types[r.answered-1]:types[Math.floor(rnd(0,types.length))];\n return {type,rare:final||Math.random()\u003c.1,final,x:clamp(r.player.x+rnd(-66,66),42,W-42),y:48};\n}\nfunction answer(index){\n if(state!=='question')return;\n const r=run,q=r.questions[r.answered], good=q.accepted.includes(index);\n state='feedback';r.answered++;\n if(good){r.right++;r.score+=150;r.pending=reward(r.answered===10);sound(r.pending.rare?'rare':'good')}\n else{\n  r.wrong++;const lost=r.gear.pop();if(lost)r.lost++;\n  r.player.flash=-1.05;burst(r.player.x,r.player.y,'#ff557c',25,125);sound('bad');\n  r.notice=lost?'失去 '+gearInfo[lost.type][0]:'保留基本武器';r.noticeTime=2;\n }\n if(r.answered===10){\n  r.boss.finalDefense=false;r.boss.shield=good?0:6;r.boss.shieldHits=0;r.questionTime=0;\n }\n panel('\u003cdiv class=\"eyebrow\">SCIENCE REPORT · '+r.answered+'/10\u003c/div>\u003ch2 class=\"'+(good?'answer-good':'answer-bad')+'\">'+\n (good?'回答正確！獲得裝備補給！':'回答錯誤！'+(r.notice==='保留基本武器'?'保留基本武器。':'裝備受損！'))+\n '\u003c/h2>\u003cp id=\"correct\">\u003c/p>\u003cp id=\"explain\">\u003c/p>\u003csmall id=\"reward\">\u003c/small>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" id=\"continue\">繼續戰鬥\u003c/button>\u003c/div>',r.answered===10?'final':'');\n $('correct').textContent=(q.accepted.length>1?'可接受答案　':'正確答案 (0,0,107,'#80bfff95',4);circle(0,0,100,'#637dcb65',2);\n  for(let i=0;i\u003c8;i++){const a=t*2+i*.785;box(Math.cos(a)*106,Math.sin(a)*106,5,5,'#ccedff')}\n }\n ctx.restore();\n}\nfunction drawDrop(d,t){\n const [,col,glyph]=gearInfo[d.type], c=d.rare?'#ffd572':col;\n if(d.rare)box(d.x-13,0,26,d.y,'#ffbf5628');\n box(d.x-13,d.y-13,26,26,c);box(d.x-10,d.y-10,20,20,'#182641');\n circle(d.x,d.y,20+Math.sin(t*11)*3,c);ctx.fillStyle=c;ctx.font='bold 17px monospace';ctx.textAlign='center';ctx.fillText(glyph,d.x,d.y+6);\n if(d.rare)box(d.x+12,d.y-14,5,5,'#fff9c8');\n}\nfunction render(){\n const r=run,t=r?r.elapsed:clock;\n background(t,r?r.stage:0);\n if(!r){drawShip({x:W/2,y:H-80,tilt:0},t,true);for(let i=0;i\u003c6;i++)drawEnemy({x:100+i*56,y:96+(i%2)*31,type:i%5,hit:0,hp:1,max:1},t);return}\n ctx.save();const shake=['fight','victory'].includes(state)?r.shake:0;\n ctx.translate(Math.sin(t*99+r.transition*85)*shake,Math.cos(t*85+r.transition*87)*shake*.45);\n for(const d of r.drops)drawDrop(d,t);\n for(const e of r.enemies)drawEnemy(e,t);\n if(r.boss&&(!r.boss.destroyed||r.transition>.35&&state==='victory'))drawBoss(r.boss,t);\n for(const h of r.hazards){const c=h.kind==='orb'?'#ff79c5':'#ff826f';line(h.x,h.y,h.x-h.vx*.07,h.y-h.vy*.07,c,4);box(h.x-3,h.y-4,6,8,'#ffe4ef')}\n for(const s of r.shots){\n  const c=s.kind==='laser'?'#fd8cff':s.kind==='missile'?'#ffc46b':'#61ecff';\n  line(s.x,s.y,s.x-s.vx*.055,s.y-s.vy*.055,c,s.kind==='laser'?8:4);\n  box(s.x-2,s.y-5,4,9,'#f2ffff');\n }\n drawShip(r.player,t);\n for(const ring of r.rings){ctx.globalAlpha=clamp(ring.life/.58,0,1);circle(ring.x,ring.y,Math.max(1,(1-ring.life/.58)*ring.size),ring.color,3)}\n for(const p of r.fx){ctx.globalAlpha=clamp(p.life/p.max,0,1);box(p.x,p.y,p.size,p.size,p.color)}\n ctx.globalAlpha=1;\n if(r.noticeTime>0&&state==='fight'){ctx.fillStyle='#fff1bb';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(r.notice,W/2,H-13)}\n if(r.boost>0){box(W/2-65,H-8,130,4,'#624e42');box(W/2-65,H-8,13*r.boost,4,'#ffd46d')}\n ctx.restore();\n}\nfunction frame(timestamp){\n const dt=last?clamp((timestamp-last)/1000,0,.075):0;last=timestamp;\n clock+=dt;\n // Keep collision steps smaller than the thinnest fast projectile.\n let rest=dt;\n while(rest>1e-6){const step=Math.min(rest,1/120),before=state;update(step);rest-=step;if(before!==state)break}\n render();requestAnimationFrame(frame);\n}\nconst gameKeys=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyW','KeyA','KeyS','KeyD','Space']);\nwindow.addEventListener('keydown',e=>{\n if(e.code==='Escape'&&!e.repeat){pause();return}\n if(state==='fight'&&gameKeys.has(e.code)){e.preventDefault();keys.add(e.code);if(e.code==='Space'&&!e.repeat)unlockAudio()}\n});\nwindow.addEventListener('keyup',e=>keys.delete(e.code));\nfunction releaseInputs(){keys.clear();touch=null;if(state==='fight')pause()}\nwindow.addEventListener('blur',releaseInputs);\ndocument.addEventListener('visibilitychange',()=>{if(document.hidden)releaseInputs()});\nfunction point(e){\n const b=canvas.getBoundingClientRect();\n touch={id:e.pointerId,x:(e.clientX-b.left)/b.width*W,y:(e.clientY-b.top)/b.height*H};\n}\ncanvas.addEventListener('pointerdown',e=>{\n if(state!=='fight'||e.pointerType==='mouse'||touch)return;\n e.preventDefault();unlockAudio();point(e);run.touchAuto=true;canvas.setPointerCapture?.(e.pointerId);\n});\ncanvas.addEventListener('pointermove',e=>{if(state==='fight'&&touch?.id===e.pointerId){e.preventDefault();point(e)}});\nfor(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>{if(touch?.id===e.pointerId)touch=null});\nclick('pause',pause);\nclick('full',async()=>{\n const cab=$('cab');\n if(document.fullscreenElement){await document.exitFullscreen();return}\n if(cab.classList.contains('screen-mode')){cab.classList.remove('screen-mode');return}\n if(cab.requestFullscreen){try{await cab.requestFullscreen();return}catch{}}\n cab.classList.add('screen-mode');\n});\nmenu();requestAnimationFrame(frame);\n\u003c/script>\u003c/html>\n"}}</script>
<script>
'use strict';
const games = JSON.parse(document.getElementById('game-data').textContent);
const home = document.getElementById('home');
const player = document.getElementById('player');
const slot = document.getElementById('frame-slot');
const title = document.getElementById('lesson-title');
let lastSelection;

function openGame(button) {
 const game = games[button.dataset.game];
 lastSelection = button;
 const frame = document.createElement('iframe');
 frame.title = game.title;
 frame.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox');
 frame.setAttribute('allow', 'fullscreen; autoplay');
 frame.setAttribute('allowfullscreen', '');
 frame.srcdoc = game.html;
 title.textContent = game.title;
 home.hidden = true;
 player.hidden = false;
 slot.replaceChildren(frame);
 document.getElementById('back').focus();
}

document.querySelectorAll('[data-game]').forEach(button => {
 button.addEventListener('click', () => openGame(button));
});

document.getElementById('back').addEventListener('click', () => {
 if (!window.confirm('返回選課後，本局遊戲會結束。確定返回？')) return;
 slot.replaceChildren();
 player.hidden = true;
 home.hidden = false;
 lastSelection?.focus();
});
</script>
